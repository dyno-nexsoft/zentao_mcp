name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (for example, 1.9.1). Leave empty to bump the last number automatically.'
        required: false
        default: ''
        type: string
      bump:
        description: 'Which part to bump when no version is given'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dyno-nexsoft'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Manual releases must run from a branch." >&2
            exit 1
          fi

          requested="${RELEASE_VERSION//[[:space:]]/}"
          if [[ -n "$requested" ]]; then
            target="${requested#v}"
          else
            target="${RELEASE_BUMP:-patch}"
          fi

          npm version "$target" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Write release notes and changelog
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/releaseNotes.mjs --version "$RELEASE_VERSION" --notes "$RUNNER_TEMP/release-notes.md" --changelog CHANGELOG.md
      - name: Commit version and push tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release ${{ steps.release.outputs.tag }}"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag }}" --verify-tag --title "${{ steps.release.outputs.tag }}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
